version: "3.9"

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: smartphoto
      POSTGRES_PASSWORD: smartphoto
      POSTGRES_DB: smartphoto
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartphoto -d smartphoto"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
  redisdata:
